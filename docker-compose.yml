# ─────────────────────────────────────────────────────────────────────────────
# Incident Response Agent — root docker-compose
#
# Services:
#   app        FastAPI order-service          → http://localhost:8000
#   db         PostgreSQL 16                  → localhost:5432
#   traffic    Locust traffic generator       → http://localhost:8089  (profile: traffic)
#   prometheus Prometheus                     → http://localhost:9090
#   loki       Grafana Loki                   → http://localhost:3100
#   promtail   Promtail (log shipper)
#   grafana    Grafana                        → http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ira-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ── Order Service (FastAPI) ──────────────────────────────────────────────────
  app:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.0"
    container_name: ira-order-service
    environment:
      DATABASE_URL: postgresql://orders:orders@db:5432/orders
      APP_VERSION: "0.1.0"
      LOG_LEVEL: INFO
      # Failure injection (all off by default)
      N_PLUS_ONE: "false"
      DB_SLOW: "false"
      DB_SLOW_SECONDS: "2.0"
      HIGH_CPU: "false"
      ERROR_SPIKE: "false"
      ERROR_SPIKE_RATE: "0.3"
      MEMORY_LEAK: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    logging: *default-logging

  # ── Traffic generator (Locust) — profile 'traffic' ──────────────────────────
  # Steady, weighted traffic against the order-service.
  # Start:  docker compose --profile traffic up -d traffic   (or: make traffic)
  # Web UI: http://localhost:8089  (set LOCUST_HEADLESS=false to drive it manually)
  traffic:
    build:
      context: ./services/traffic
      dockerfile: Dockerfile
    container_name: ira-traffic
    environment:
      LOCUST_HOST: "http://app:8000"
      LOCUST_USERS: "10"
      LOCUST_SPAWN_RATE: "2"
      LOCUST_HEADLESS: "true"
    ports:
      - "8089:8089"
    depends_on:
      - app
    restart: on-failure
    profiles: ["traffic"]
    logging: *default-logging

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ira-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    logging: *default-logging

  # ── Loki ─────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.6
    container_name: ira-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    logging: *default-logging

  # ── Promtail ─────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.6
    container_name: ira-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    ports:
      - "9080:9080"
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging
    
  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ira-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

volumes:
  pgdata:
  prometheus_data:
  loki_data:
  grafana_data:
