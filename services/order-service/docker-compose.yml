services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.0"
    environment:
      DATABASE_URL: postgresql://orders:orders@db:5432/orders
      APP_VERSION: "0.1.0"
      LOG_LEVEL: INFO
      # ── Failure injection (all off by default) ───────────────────────────
      N_PLUS_ONE: "false"
      DB_SLOW: "false"
      DB_SLOW_SECONDS: "2.0"
      HIGH_CPU: "false"
      ERROR_SPIKE: "false"
      ERROR_SPIKE_RATE: "0.3"
      MEMORY_LEAK: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
